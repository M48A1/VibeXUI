<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeXUI · 服务器面板</title><link rel="stylesheet" href="/style.css"><script src="/routing.js" defer></script><script src="/snell.js" defer></script><script src="/app.js" defer></script></head><body>
<div id="login" class="login"><form id="login-form" class="login-card"><div class="brand-mark">V</div><h1>VibeXUI</h1><p>你的服务器，一处掌控。</p><label>用户名<input name="username" autocomplete="username" value="admin" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录面板 →</button><p id="login-error" class="error" role="alert"></p><small>轻量 · 多服务器 · Xray</small></form></div>
<div id="app" hidden><aside><a class="brand" href="/"> <span class="brand-mark">V</span>VibeXUI<span class="edition">LITE</span></a><button id="kernel-selector" class="kernel-selector" type="button" title="选择服务器和 Xray 内核版本"><span>◈ Xray 内核</span><small id="kernel-current">选择版本 ▾</small></button><div class="nav-label">工作空间</div><nav><button data-page="overview" class="active"><span>◫</span>总览</button><button data-page="servers"><span>▤</span>服务器</button><button data-page="nodes"><span>◇</span>入站</button><button data-page="snell"><span>◇</span>Snell 入站</button><button data-page="clients"><span>♙</span>客户端</button><button data-page="outbounds"><span>↗</span>出站管理</button><button data-page="routing"><span>⑂</span>路由分流</button><button data-page="notifications"><span>♧</span>外部通知</button><button data-page="settings"><span>⚙</span>后台设置</button></nav><div class="sidebar-bottom"><div class="version">VibeXUI <span>0.4.0</span></div><p>简单管理，专注连接。</p><a href="/api/backup" class="subtle">导出配置备份 ↗</a><button id="logout" class="subtle">退出登录</button></div></aside>
<main><header><div class="breadcrumb">工作空间 <span>/</span> <b id="crumb">总览</b></div><div class="header-right"><span id="sync-indicator">正在连接</span><button id="refresh-button" title="立即更新">↻ 更新</button><span class="avatar">A</span></div></header><div class="content"><div class="page-heading"><div><div class="eyebrow">YOUR INFRASTRUCTURE, CONNECTED</div><h1 id="page-title">服务器总览</h1><p id="page-description">查看服务器状态，管理你的连接。</p></div><button id="add-button" class="primary">＋ 添加服务器</button></div><div id="metrics" class="metrics"></div><div id="overview-guide"></div><div class="list-toolbar"><input id="search" type="search" aria-label="搜索列表" placeholder="搜索名称、Email、分组或 UUID"><select id="filter" aria-label="筛选状态"><option value="all">所有状态</option></select><select id="group-filter" aria-label="筛选分组" hidden><option value="">所有分组</option></select><button id="import-button" hidden>导入入站</button><button id="cleanup-button" hidden>清理耗尽客户端</button><button id="batch-button" hidden>批量添加</button><button id="export-button" hidden>导出流量 CSV</button><span id="result-count"></span></div><section id="workspace"></section><footer>VibeXUI <span>·</span> 每 10 秒自动更新 <span>·</span> 配置应用可能短暂中断连接</footer></div></main></div>
<dialog id="kernel-dialog"><div class="dialog-head"><h2>Xray 内核版本</h2><button type="button" data-close aria-label="关闭">×</button></div><div class="kernel-fields"><label>目标服务器<select id="kernel-server" aria-label="目标服务器"></select></label><p id="kernel-status" class="notice" role="status"></p><label>选择官方版本<select id="kernel-version" aria-label="选择官方版本"><option value="">正在读取…</option></select></label><p class="hint">切换会短暂中断该服务器的代理连接。下载期间保持服务运行；校验和启动失败会保留或恢复原内核。预发布版本已标注。</p><p id="kernel-error" class="error" role="alert"></p><div class="actions"><button id="kernel-install" class="primary" type="button">安装所选版本</button><button id="kernel-rollback" type="button">回滚上一版本</button><button id="kernel-reload" type="button">刷新版本列表</button></div></div></dialog><dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" data-close aria-label="关闭">×</button></div><div id="fields"></div><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="info"><div class="dialog-head"><h2 id="info-title"></h2><button data-close aria-label="关闭">×</button></div><div id="info-body"></div><div class="dialog-actions"><button data-close>关闭</button></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
